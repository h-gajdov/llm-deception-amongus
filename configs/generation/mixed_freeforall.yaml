



experiment_name: mixed_freeforall
num_games: 30
seed: 0
output_dir: expt-logs
log_level: INFO
write_compact_logs: true

game:
  num_players: 7
  num_impostors: 2
  num_common_tasks: 1
  num_short_tasks: 1
  num_long_tasks: 1
  discussion_rounds: 3
  max_num_buttons: 2
  kill_cooldown: 3
  max_timesteps: 50

agent:
  impostor_backend: ollama
  crewmate_backend: ollama
  impostor_llm_choices: ["ollama:qwen3:8b", "openai:gpt-4o-mini"]
  crewmate_llm_choices: ["ollama:qwen3:8b", "openai:gpt-4o-mini"]
  ollama:
    model: qwen3:8b
    max_tokens: 1024
    think: false
  openai:
    model: gpt-4o-mini
    api_key_env: OPENAI_API_KEY
    max_tokens: 1024
