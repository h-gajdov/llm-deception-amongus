experiment_name: qwen3_8b_selfplay
num_games: 1
seed: 0
output_dir: expt-logs
log_level: INFO
write_compact_logs: true

write_legacy_logs: true

write_world_states: true
annotate: true

game:
  num_players: 7
  num_impostors: 2
  num_common_tasks: 1
  num_short_tasks: 1
  num_long_tasks: 1
  discussion_rounds: 3
  max_num_buttons: 2
  kill_cooldown: 3

  initial_kill_cooldown: 3
  max_timesteps: 50
  map_name: skeld
  meeting_order: seating
  role_assignment: random
  count_dead_crewmate_tasks: false
  visibility:

    mode: full_room
    ghosts_observe: false
    reveal_role_on_ejection: false
    reveal_votes: true

    body_report_reveals_killer: false
    camera_rooms: ["Cafeteria", "Admin", "Upper Engine", "Electrical"]

agent:
  impostor_backend: ollama
  crewmate_backend: ollama
  impostor_llm_choices: ["qwen3:8b"]
  crewmate_llm_choices: ["qwen3:8b"]

  prompt_template: v2

  role_prompt_mode: separate
  personality_mode: none
  max_parse_retries: 1
  ollama:
    model: qwen3:8b
    host: http://localhost:11434
    temperature: 0.7
    top_p: 0.9
    num_ctx: 8192
    max_tokens: 1024

    think: false
    request_timeout_s: 180.0
    max_retries: 2
