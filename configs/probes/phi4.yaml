












dataset_dir: data/processed/contrastive
output_dir: data/probes/phi-4

model:
  name: microsoft/phi-4
  device: cuda
  dtype: auto




use_chat_template: true



layers: null
pooling: last
max_length: 2048
extraction_batch_size: 16

probe:
  epochs: 200
  lr: 0.001
  weight_decay: 0.001
  batch_size: 64
  standardize: true
  log_every: 10

tracking:
  wandb:
    enabled: true
    project: amongus-probes
    run_name: phi-4
    mode: online
  mlflow:
    enabled: true
    experiment: amongus-probes
    run_name: phi-4


seed: 0
