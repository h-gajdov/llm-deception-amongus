dataset_dir: data/processed/contrastive
output_dir: data/probes/phi4_4bit

model:
  name: microsoft/phi-4
  device: cuda
  dtype: auto
  quantization:
    load_in_4bit: true
    bnb_4bit_quant_type: nf4
    bnb_4bit_use_double_quant: true
    bnb_4bit_compute_dtype: float16

layers: [8, 12, 16, 20, 24, 28, 32]
pooling: last
max_length: 512
extraction_batch_size: 8
use_chat_template: true

probe:
  epochs: 200
  lr: 0.001
  weight_decay: 0.001
  batch_size: 64
  standardize: true
  log_every: 10

tracking:
  wandb:
    enabled: true
    project: amongus-probes
    run_name: phi4-4bit
    mode: online
  mlflow:
    enabled: true
    experiment: amongus-probes
    run_name: phi4-4bit

seed: 0
